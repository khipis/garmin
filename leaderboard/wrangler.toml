name = "garmin"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# ── Custom domain (bypasses Cisco Umbrella / OpenDNS *.workers.dev block) ─────
# Cloudflare auto-creates the proxied DNS record + TLS cert for api.bitochi.com.
routes = [
  { pattern = "api.bitochi.com", custom_domain = true }
]

# ── Scheduled upkeep ──────────────────────────────────────────────────────────
# Sundays 04:10 UTC: rebuild D1 table statistics (so the query planner keeps
# choosing index seeks over full scans as the tables grow) and drop expired
# aggregate-cache rows. See the `scheduled` handler in src/index.ts.
[triggers]
crons = ["10 4 * * SUN"]

# ── D1 Database ───────────────────────────────────────────────────────────────
[[d1_databases]]
binding      = "DB"                          # env.DB in Worker code
database_name = "bitochi-leaderboard"
database_id  = "3bea63ef-e758-4489-84c4-8b72933fd98e"
